    };

    function App() {
      const [tab, setTab] = useState("checklist");
      const [selectedDay, setSelectedDay] = useState(1);
      const [checklistState, setChecklistState] = useState({});
      const [messages, setMessages] = useState([
        { sender: "bot", text: "Xin chào bạn! Mình là AI Trợ lý OJT Phong Vũ. Hôm nay bạn cần ôn bài ngày mấy, hay cần hỏi về tương thích PC, chuẩn mực chào đón khách hàng?" }
      ]);
      const [inputQuery, setInputQuery] = useState("");

      const handleCheck = (id, status) => {
        setChecklistState(prev => ({
          ...prev,
          [id]: prev[id] === status ? undefined : status
        }));
      };

      const passedCount = useMemo(() => {
        return Object.values(checklistState).filter(v => v === "pass").length;
      }, [checklistState]);

      const progressPercent = Math.round((passedCount / OJT_CHECKLIST.length) * 100);

      const handleSend = (textToSend) => {
        const query = textToSend || inputQuery;
        if (!query.trim()) return;

        const newMessages = [...messages, { sender: "user", text: query }];
        setMessages(newMessages);
        setInputQuery("");

        // Phản hồi thông minh theo nội dung tài liệu
        setTimeout(() => {
          let reply = "Dạ, vấn đề này bạn bám sát quy chuẩn Phong Vũ nhé:";
          const q = query.toLowerCase();

          if (q.includes("hôm nay") || q.includes("học gì") || q.includes("ngày 1") || q.includes("ngày 2") || q.includes("ngày 3") || q.includes("ngày 4") || q.includes("ngày 5")) {
            reply = "Bạn hãy chọn xem lại theo từng ngày ở tab 'Ôn Tập Bài Học' phía trên để nắm trọn vẹn lộ trình 5 ngày nhé! Tóm tắt nhanh: Ngày 1 (Hội nhập & Tiêu chuẩn CH), Ngày 2 (6 bước bán hàng & FABE), Ngày 3 (Laptop & NPU AI), Ngày 4 (Build PC & 5 điểm đỏ), Ngày 5 (Quản lý tiền mặt & POS).";
          } else if (q.includes("pc") || q.includes("tương thích") || q.includes("điểm đỏ")) {
            reply = "5 Điểm đỏ khi Build PC: (1) Socket CPU phải khớp Chipset bo mạch chủ (Intel main B/Z, AMD main B/X); (2) Đúng chuẩn RAM DDR4 hay DDR5; (3) Đi RAM theo cặp để bật Dual Channel; (4) Nguồn chuẩn 80 Plus dư tải tối thiểu 15-20%; (5) Chiều dài card VGA và chiều cao tản nhiệt lắp vừa case!";
          } else if (q.includes("chào") || q.includes("golden") || q.includes("4 điểm")) {
            reply = "Nghi thức chào 4 điểm chạm chuẩn Phong Vũ: (1) Đứng thẳng hướng mắt về khách; (2) Đặt bàn tay lên ngực trái vị trí trái tim; (3) Cúi người nhẹ khoảng 15 độ kèm nụ cười tươi; (4) Nói to rõ câu chào: 'Dạ Phong Vũ xin chào!'.";
          } else if (q.includes("chê đắt") || q.includes("giá cao") || q.includes("đối thủ")) {
            reply = "Xử lý khi khách chê giá: Áp dụng công thức LAST (Lắng nghe & đồng cảm). Nếu đối thủ nhỏ lẻ rẻ hơn, nêu bật giá trị Phong Vũ: hàng chính hãng VAT 100%, 1 đổi 1 tận nơi, kỹ thuật viên ủy quyền nâng cấp không mất bảo hành hãng, hỗ trợ trả góp 0%!";
          } else {
            reply = `Về nội dung "${query}": Bạn lưu ý luôn lấy khách hàng làm trọng tâm, tuân thủ đúng quy chuẩn phục vụ Golden Rule và tham khảo các checklist chi tiết trong giai đoạn OJT nhé!`;
          }

          setMessages([...newMessages, { sender: "bot", text: reply }]);
        }, 500);
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col shadow-lg">
          {/* Header */}
          <div className="bg-blue-600 text-white p-4 sticky top-0 z-20 shadow-md">
            <div className="flex justify-between items-center">
              <div>
                <h1 className="text-lg font-bold">PHONG VŨ OJT COACH</h1>
                <p className="text-xs text-blue-100">Đồng hành cùng nhân viên mới</p>
              </div>
              <div className="text-right">
                <span className="text-xs font-semibold bg-blue-700 px-2 py-1 rounded">GĐ2: Thử việc</span>
              </div>
            </div>

            {/* Thanh tiến độ OJT */}
            <div className="mt-3 bg-blue-800/60 p-2 rounded-lg">
              <div className="flex justify-between text-xs mb-1">
                <span>Tiến độ đạt Checklist: <strong>{passedCount}/{OJT_CHECKLIST.length}</strong> mục</span>
                <span className={`font-bold ${progressPercent >= 80 ? 'text-emerald-300' : 'text-amber-300'}`}>{progressPercent}% (Chuẩn: 80%)</span>
              </div>
              <div className="w-full bg-blue-950 h-2.5 rounded-full overflow-hidden">
                <div 
                  className={`h-full transition-all duration-300 ${progressPercent >= 80 ? 'bg-emerald-400' : 'bg-amber-400'}`}
                  style={{ width: `${Math.min(progressPercent, 100)}%` }}
                ></div>
              </div>
            </div>

            {/* Thanh Tab chuyển đổi */}
            <div className="flex mt-3 bg-blue-700/50 p-1 rounded-lg text-xs font-medium">
              <button 
                onClick={() => setTab("checklist")} 
                className={`flex-1 py-1.5 rounded text-center transition-all ${tab === "checklist" ? "bg-white text-blue-700 shadow font-bold" : "text-white"}`}
              >
                <Icons.CheckSquare /> Checklist
              </button>
              <button 
                onClick={() => setTab("lessons")} 
                className={`flex-1 py-1.5 rounded text-center transition-all ${tab === "lessons" ? "bg-white text-blue-700 shadow font-bold" : "text-white"}`}
              >
                <Icons.BookOpen /> Ôn Bài Học
              </button>
              <button 
                onClick={() => setTab("chat")} 
                className={`flex-1 py-1.5 rounded text-center transition-all ${tab === "chat" ? "bg-white text-blue-700 shadow font-bold" : "text-white"}`}
              >
                <Icons.Bot /> Hỏi Đáp AI
              </button>
            </div>
          </div>

          {/* Nội dung Tab 1: Checklist OJT */}
          {tab === "checklist" && (
            <div className="flex-1 p-3 space-y-3 pb-8">
              <div className="text-xs text-slate-500 flex justify-between items-center px-1">
                <span>Danh mục 20 tiêu chí chuẩn hoá</span>
                <span className="text-emerald-600 font-medium">Đạt tối thiểu: 16 mục</span>
              </div>

              {OJT_CHECKLIST.map((item) => {
                const status = checklistState[item.id];
                return (
                  <div key={item.id} className="bg-white rounded-xl p-3 border border-slate-200 shadow-sm text-sm">
                    <div className="flex justify-between items-start gap-2">
                      <span className="text-xs font-bold px-2 py-0.5 rounded bg-blue-50 text-blue-700">{item.id}</span>
                      <h3 className="font-semibold text-slate-800 flex-1">{item.title}</h3>
                    </div>

                    <p className="text-xs text-slate-500 mt-1">{item.desc}</p>

                    <div className="mt-2 text-xs bg-emerald-50 text-emerald-800 p-2 rounded">
                      <span className="font-bold">✓ Tiêu chí Đạt:</span> {item.passReq}
                    </div>

                    <div className="mt-1 text-xs bg-rose-50 text-rose-800 p-2 rounded">
                      <span className="font-bold">✗ Điểm Chưa đạt:</span> {item.failReq}
                    </div>

                    <div className="flex gap-2 mt-3 pt-2 border-t border-slate-100">
                      <button
                        onClick={() => handleCheck(item.id, "pass")}
                        className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all border ${status === "pass" ? "bg-emerald-600 text-white border-emerald-600 shadow" : "bg-white text-emerald-600 border-emerald-300"}`}
                      >
                        Đạt chuẩn
                      </button>
                      <button
                        onClick={() => handleCheck(item.id, "fail")}
                        className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all border ${status === "fail" ? "bg-rose-600 text-white border-rose-600 shadow" : "bg-white text-rose-600 border-rose-300"}`}
                      >
                        Chưa đạt
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Nội dung Tab 2: Ôn tập bài học 5 ngày */}
          {tab === "lessons" && (
            <div className="flex-1 p-3 pb-8">
              {/* Thanh chọn ngày */}
              <div className="flex gap-1.5 overflow-x-auto pb-2 no-scrollbar">
                {[1, 2, 3, 4, 5].map((day) => (
                  <button
                    key={day}
                    onClick={() => setSelectedDay(day)}
                    className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${selectedDay === day ? "bg-blue-600 text-white shadow" : "bg-white text-slate-600 border border-slate-200"}`}
                  >
                    Ngày {day}
                  </button>
                ))}
              </div>

              {/* Tóm tắt bài học */}
              <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-sm mt-3">
                <h2 className="font-bold text-blue-700 text-sm mb-3">{LESSONS[selectedDay].title}</h2>
                <div className="space-y-2">
                  {LESSONS[selectedDay].summary.map((point, index) => (
                    <div key={index} className="flex gap-2 text-xs leading-relaxed text-slate-700">
                      <span className="text-blue-500 font-bold">•</span>
                      <span>{point}</span>
                    </div>
                  ))}
                </div>

                <button
                  onClick={() => {
                    setTab("chat");
                    handleSend(`Tóm tắt chi tiết hơn nội dung bài học Ngày ${selectedDay}`);
                  }}
                  className="w-full mt-4 bg-blue-50 hover:bg-blue-100 text-blue-700 py-2 rounded-lg text-xs font-semibold text-center transition-all"
                >
                  Hỏi AI chi tiết về Ngày {selectedDay}
                </button>
              </div>
            </div>
          )}

          {/* Nội dung Tab 3: Hỏi đáp AI */}
          {tab === "chat" && (
            <div className="flex-1 flex flex-col h-[calc(100vh-170px)]">
              {/* Lịch sử tin nhắn */}
              <div className="flex-1 overflow-y-auto p-3 space-y-3 text-xs">
                {messages.map((m, idx) => (
                  <div key={idx} className={`flex ${m.sender === "user" ? "justify-end" : "justify-start"}`}>
                    <div className={`max-w-[85%] rounded-2xl px-3.5 py-2.5 ${m.sender === "user" ? "bg-blue-600 text-white rounded-tr-none" : "bg-white border border-slate-200 text-slate-800 rounded-tl-none shadow-sm"}`}>
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>

              {/* Gợi ý câu hỏi nhanh */}
              <div className="p-2 bg-slate-100 border-t border-slate-200 flex gap-2 overflow-x-auto no-scrollbar">
                {["5 điểm đỏ khi build PC là gì?", "Cách chào khách chuẩn 4 bước?", "Khách chê giá cao xử lý sao?"].map((q, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleSend(q)}
                    className="bg-white border border-slate-300 hover:border-blue-500 text-slate-700 px-2.5 py-1 rounded-full text-[11px] whitespace-nowrap shadow-xs"
                  >
                    {q}
                  </button>
                ))}
              </div>

              {/* Ô gõ câu hỏi */}
              <div className="p-2 bg-white border-t border-slate-200 flex gap-2">
                <input
                  type="text"
                  value={inputQuery}
                  onChange={(e) => setInputQuery(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && handleSend()}
                  placeholder="Hỏi về bài học, tình huống..."
                  className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-600"
                />
                <button
                  onClick={() => handleSend()}
                  className="bg-blue-600 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center justify-center hover:bg-blue-700"
                >
                  <Icons.Send />
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
