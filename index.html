      const q = query.toLowerCase();

      if ((q.includes("5600") || q.includes("5700") || q.includes("5800") || q.includes("3600") || q.includes("am4")) && 
          (q.includes("b650") || q.includes("x670") || q.includes("a620") || q.includes("b850") || q.includes("am5"))) {
        return "❌ KHÔNG ĐƯỢC BẠN NHÉ! Đây là lỗi xung đột Socket nghiêm trọng:\n\n" +
          "• CPU AMD Ryzen 5 5600 dùng Socket AM4 và chuẩn RAM DDR4.\n" +
          "• Mainboard Asus B650 dùng Socket AM5 và chuẩn RAM DDR5.\n\n" +
          "👉 Hướng tư vấn thay thế cho khách:\n" +
          "1. Giữ CPU Ryzen 5 5600: Đổi Main sang Asus Prime B550M hoặc B450M (Socket AM4) + RAM DDR4 (Tiết kiệm ngân sách).\n" +
          "2. Giữ Main Asus B650: Đổi CPU lên AMD Ryzen 5 7500F hoặc 7600 (Socket AM5) + RAM DDR5 (Đón đầu công nghệ).";
      }

      if ((q.includes("12400") || q.includes("13400") || q.includes("14400")) && (q.includes("z890") || q.includes("b860") || q.includes("1851"))) {
        return "❌ KHÔNG TƯƠNG THÍCH! CPU Intel thế hệ 12/13/14 chạy Socket LGA1700, không thể lắp vào bo mạch chủ mới Socket LGA1851 (Z890, B860). Hãy tư vấn khách dùng Mainboard H610, B760 hoặc Z790 nhé!";
      }

      if ((q.includes("intel") || q.includes("core i") || q.includes("ultra")) && (q.includes("b650") || q.includes("b550") || q.includes("x670") || q.includes("am4") || q.includes("am5"))) {
        return "❌ LỖI NGHIÊM TRỌNG: Bạn đang gắn CPU Intel vào Mainboard của AMD! Nhớ câu thần chú đào tạo: 'Bác 67 Ham Zui' (Intel: H, B đuôi 60/70, Z) và 'Bác 50 Ăn Xài' (AMD: A, B đuôi 50, X).";
      }
      if ((q.includes("ryzen") || q.includes("amd")) && (q.includes("b760") || q.includes("z790") || q.includes("h610") || q.includes("b660"))) {
        return "❌ KHÔNG TƯƠNG THÍCH: CPU AMD Ryzen không cắm vừa bo mạch chủ dành cho Intel (H610, B760, Z790).";
      }

      if ((q.includes("4070") || q.includes("4080") || q.includes("4090") || q.includes("5070")) && (q.includes("450w") || q.includes("500w") || q.includes("550w"))) {
        return "⚠️ NGUY HIỂM / KHÔNG ĐẠT: Nguồn công suất quá yếu! Dòng VGA cao cấp như RTX 4070/5070 yêu cầu PSU tối thiểu từ 650W - 750W chuẩn 80 Plus Bronze/Gold để đảm bảo không bị sập nguồn khi tải nặng.";
      }

      if (q.includes("5 điểm đỏ") || q.includes("điểm đỏ") || (q.includes("lưu ý") && q.includes("build pc"))) {
        return "📌 5 ĐIỂM ĐỎ KIỂM TRA TƯƠNG THÍCH PC:\n" +
          "1. Socket CPU khớp Chipset Mainboard (Intel: LGA1700; AMD: AM4/AM5).\n" +
          "2. RAM đúng chuẩn bo mạch hỗ trợ (DDR4 vs DDR5).\n" +
          "3. Luôn lắp RAM theo cặp (2 thanh) để kích hoạt Dual Channel nhân đôi băng thông.\n" +
          "4. Nguồn (PSU) chuẩn 80 Plus, tính dư tải an toàn 15 - 20%.\n" +
          "5. Kích thước lắp vừa thùng case (chiều dài VGA và chiều cao tản nhiệt khí/rad nước).";
      }

      if (q.includes("chào") || q.includes("4 điểm") || q.includes("golden rule")) {
        return "👋 NGHI THỨC CHÀO ĐÓN 4 ĐIỂM CHẠM (GOLDEN RULE):\n" +
          "1. Đứng thẳng, ánh mắt hướng về phía khách hàng.\n" +
          "2. Đặt bàn tay lên ngực trái (vị trí trái tim) thể hiện sự trân trọng.\n" +
          "3. Cúi người khoảng 15 độ với nụ cười thân thiện.\n" +
          "4. Nói rõ câu chào chuẩn mực: 'Dạ Phong Vũ xin chào!'.";
      }

      if (q.includes("chê đắt") || q.includes("giá cao") || q.includes("đối thủ") || q.includes("rẻ hơn")) {
        return "💡 XỬ LÝ KHÁCH CHÊ GIÁ CAO (ÁP DỤNG LAST):\n" +
          "• Lắng nghe và đồng cảm, tuyệt đối không đôi co tranh cãi.\n" +
          "• Khách so sánh với sàn TMĐT: Giải thích chính sách trợ giá riêng của sàn, nhấn mạnh mua tại showroom được bảo hành 1 đổi 1 tận nơi, máy sẵn kiểm tra liền tay.\n" +
          "• Khách so sánh với cửa hàng nhỏ lẻ: Nêu bật thế mạnh Phong Vũ là hàng chính hãng 100% có VAT, kỹ thuật viên ủy quyền nâng cấp linh kiện không bị mất bảo hành hãng, hỗ trợ trả góp 0%!";
      }

      if (q.includes("main amd") || q.includes("mainboard amd") || (q.includes("amd") && q.includes("mới nhất"))) {
        return "⚡ DÒNG MAINBOARD AMD MỚI NHẤT:\n" +
          "Hiện nay các dòng Bo mạch chủ mới nhất dành cho AMD là thế hệ Socket AM5:\n" +
          "• Phân khúc cao cấp: X870E, X870, X670E (hỗ trợ ép xung, PCIe 5.0 toàn diện).\n" +
          "• Phân khúc tầm trung/phổ biến: B850, B650 (cân bằng hiệu năng/giá thành tốt nhất cho Ryzen 7000/9000).\n" +
          "• Phân khúc cơ bản: B840, A620.\n" +
          "Tất cả đều bắt buộc chạy chuẩn RAM DDR5!";
      }

      if (q.includes("hôm nay") || q.includes("học gì") || q.includes("ngày 1") || q.includes("ngày 2") || q.includes("ngày 3") || q.includes("ngày 4") || q.includes("ngày 5")) {
        return "📚 TÓM TẮT LỘ TRÌNH 5 NGÀY OJT:\n" +
          "• Ngày 1: Hội nhập văn hóa (1997, 4 giá trị cốt lõi) & Tiêu chuẩn CH (HR_QĐ.01, Golden Rule, mã lỗi SHR).\n" +
          "• Ngày 2: Kỹ năng 6 bước bán hàng, câu hỏi SPIN, mô hình FABE, xử lý phản bác LAST, 4 kỹ thuật chốt đơn.\n" +
          "• Ngày 3: Kiến thức Laptop (CPU U/V vs H/HX, RAM, SSD NVMe, GPU rời vs Onboard, Màn hình, AI PC).\n" +
          "• Ngày 4: Cấu tạo PC, 5 điểm đỏ tương thích, phân bổ ngân sách Gaming/Đồ họa/Văn phòng.\n" +
          "• Ngày 5: Quy trình 7 bước quản lý tiền mặt, thao tác túi Zip/Dropbox dưới camera CCTV, các hình thức thanh toán POS/Trả góp.";
      }

      return "Dạ, về câu hỏi '" + query + "':\nBạn lưu ý luôn bám sát quy trình phục vụ chuẩn của Phong Vũ, tuân thủ 5 Điểm đỏ kỹ thuật khi tư vấn phần cứng và tham khảo chi tiết theo từng ngày trong tab 'Ôn Bài Học' nhé!";
    }

    function App() {
      const [tab, setTab] = useState("checklist");
      const [selectedDay, setSelectedDay] = useState(1);
      const [filterGroup, setFilterGroup] = useState("ALL");
      
      const [staffName, setStaffName] = useState("");
      const [storeName, setStoreName] = useState("");
      const [evalRound, setEvalRound] = useState("Lần 1");
      const [evaluator, setEvaluator] = useState("");
      const [checklistState, setChecklistState] = useState({});
      const [notesState, setNotesState] = useState({});
      const [isSendingSheet, setIsSendingSheet] = useState(false);

      const [messages, setMessages] = useState([
        { sender: "bot", text: "Xin chào bạn! Mình là AI Trợ lý OJT Phong Vũ. Bạn có thể hỏi mình mọi thứ: Kiểm tra độ tương thích CPU/Main PC, phân tích cấu hình, cách chào khách chuẩn 4 bước hay nội dung học 5 ngày nhé!" }
      ]);
      const [inputQuery, setInputQuery] = useState("");

      const handleCheck = (id, status) => {
        setChecklistState(prev => ({
          ...prev,
          [id]: prev[id] === status ? undefined : status
        }));
      };

      const handleNoteChange = (id, text) => {
        setNotesState(prev => ({ ...prev, [id]: text }));
      };

      const passedCount = useMemo(() => {
        return Object.values(checklistState).filter(v => v === "pass").length;
      }, [checklistState]);

      const progressPercent = Math.round((passedCount / OJT_CHECKLIST.length) * 100);

     // HÀM GỬI DỮ LIỆU TÁCH CỘT VỀ GOOGLE SHEETS
      const handleSendToGoogleSheet = async () => {
        if (!staffName.trim()) {
          alert("⚠️ Vui lòng nhập Họ tên Nhân viên bán hàng trước khi gửi!");
          return;
        }

        const evaluatedCount = Object.keys(checklistState).length;
        if (evaluatedCount < OJT_CHECKLIST.length) {
          const confirmSend = confirm(`Bạn mới đánh giá ${evaluatedCount}/${OJT_CHECKLIST.length} tiêu chí. Bạn có chắc chắn muốn gửi kết quả này không?`);
          if (!confirmSend) return;
        }

        if (!GOOGLE_SHEET_WEBAPP_URL || GOOGLE_SHEET_WEBAPP_URL.includes("...")) {
          alert("⚠️ Bạn chưa cấu hình đúng GOOGLE_SHEET_WEBAPP_URL!");
          return;
        }

        setIsSendingSheet(true);

        // Đóng gói chi tiết từng tiêu chí thành Object theo mã tiêu chí
        const itemsPayload = {};
        OJT_CHECKLIST.forEach(item => {
          itemsPayload[item.id] = {
            status: checklistState[item.id] === "pass" ? "ĐẠT" : checklistState[item.id] === "fail" ? "CHƯA ĐẠT" : "Chưa đánh giá",
            note: notesState[item.id] || ""
          };
        });

        const payload = {
          timestamp: new Date().toLocaleString("vi-VN"),
          staffName: staffName.trim(),
          storeName: storeName.trim() || "Chưa nhập",
          evalRound: evalRound,
          evaluator: evaluator.trim() || "Chưa nhập",
          passedCount: passedCount,
          totalCount: OJT_CHECKLIST.length,
          progressPercent: progressPercent,
          isPassed: progressPercent >= 80,
          items: itemsPayload
        };

        try {
          await fetch(GOOGLE_SHEET_WEBAPP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });

          alert("✅ ĐÃ GỬI THÀNH CÔNG!\nKết quả đã được tách cột chi tiết vào Google Sheet của Giảng viên.");
        } catch (error) {
          alert("❌ Có lỗi kết nối khi gửi dữ liệu. Vui lòng kiểm tra lại mạng!");
        } finally {
          setIsSendingSheet(false);
        }
      };

      const handleExportReport = () => {
        const currentDate = new Date().toLocaleDateString('vi-VN');
        const isPassed = progressPercent >= 80;

        let content = `PHIẾU ĐÁNH GIÁ NĂNG LỰC NHÂN VIÊN BÁN HÀNG - GIAI ĐOẠN 2 (OJT)\n`;
        content += `HỆ THỐNG CỬA HÀNG PHONG VŨ\n`;
        content += `---------------------------------------------------------\n`;
        content += `Họ tên NVBH    : ${staffName || "(Chưa nhập)"}\n`;
        content += `Cửa hàng/Showroom: ${storeName || "(Chưa nhập)"}\n`;
        content += `Đợt đánh giá   : ${evalRound}\n`;
        content += `Người đánh giá : ${evaluator || "(Chưa nhập)"}\n`;
        content += `Ngày xuất      : ${currentDate}\n`;
        content += `---------------------------------------------------------\n`;
        content += `KẾT QUẢ ĐÁNH GIÁ:\n`;
        content += `• Số mục Đạt   : ${passedCount}/${OJT_CHECKLIST.length}\n`;
        content += `• Tỷ lệ hoàn thành: ${progressPercent}%\n`;
        content += `• Kết luận     : ${isPassed ? "ĐẠT CHUẨN NĂNG LỰC GĐ2 (>= 80%)" : "CHƯA ĐẠT (Cần đào tạo & kèm cặp thêm)"}\n`;
        content += `---------------------------------------------------------\n\n`;
        content += `CHI TIẾT TỪNG TIÊU CHÍ ĐÁNH GIÁ:\n`;

        OJT_CHECKLIST.forEach((item, index) => {
          const status = checklistState[item.id] === "pass" ? "[ ĐẠT ]" : checklistState[item.id] === "fail" ? "[ CHƯA ĐẠT ]" : "[ CHƯA ĐÁNH GIÁ ]";
          const note = notesState[item.id] ? ` (Ghi chú: ${notesState[item.id]})` : "";
          content += `${index + 1}. [${item.id}] ${item.title}: ${status}${note}\n`;
        });

        content += `\n---------------------------------------------------------\n`;
        content += `XÁC NHẬN CỦA CÁC BÊN:\n\n`;
        content += `Người Đánh Giá / Coach             Nhân Viên Được Đánh Giá\n`;
        content += `(Ký và ghi rõ họ tên)               (Ký và ghi rõ họ tên)\n`;

        const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `OJT_DanhGia_${evalRound}_${staffName ? staffName.replace(/\s+/g, '_') : 'NVBH'}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };

      // GỌI TRỰC TIẾP QUA VERCEL API (KẾT NỐI GEMINI AI THẬT)
      const handleSend = async (textToSend) => {
        const query = textToSend || inputQuery;
        if (!query.trim()) return;

        const updatedMessages = [...messages, { sender: "user", text: query }];
        setMessages(updatedMessages);
        setInputQuery("");

        // Hiển thị trạng thái đang trả lời
        setMessages([...updatedMessages, { sender: "bot", text: "..." }]);

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              messages: updatedMessages.map(m => ({ sender: m.sender, text: m.text }))
            })
          });

          const data = await response.json();
          if (data.error) {
            setMessages([...updatedMessages, { sender: "bot", text: `⚠️ ${data.error}` }]);
          } else {
            setMessages([...updatedMessages, { sender: "bot", text: data.reply }]);
          }
        } catch (error) {
          setMessages([...updatedMessages, { sender: "bot", text: "❌ Có lỗi kết nối tới máy chủ AI." }]);
        }
      };

      const filteredChecklist = useMemo(() => {
        if (filterGroup === "ALL") return OJT_CHECKLIST;
        return OJT_CHECKLIST.filter(item => item.group === filterGroup);
      }, [filterGroup]);

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col shadow-lg">
          {/* Header */}
          <div className="bg-blue-600 text-white p-4 sticky top-0 z-20 shadow-md">
            <div className="flex justify-between items-center">
              <div>
                <h1 className="text-lg font-bold">PHONG VŨ OJT COACH</h1>
                <p className="text-xs text-blue-100">Đồng hành & Đánh giá năng lực GĐ2</p>
              </div>
              <div className="text-right flex items-center gap-1.5">
                {/* Nút Gửi Google Sheet */}
                <button
                  onClick={handleSendToGoogleSheet}
                  disabled={isSendingSheet}
                  className="bg-amber-400 hover:bg-amber-500 text-slate-900 px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow-sm transition-all disabled:opacity-50"
                  title="Gửi dữ liệu trực tiếp về Google Sheet cho Giảng viên"
                >
                  <Icons.SendCloud /> {isSendingSheet ? "Đang gửi..." : "Gửi Sheet"}
                </button>
                <button
                  onClick={handleExportReport}
                  className="bg-emerald-500 hover:bg-emerald-600 text-white p-1.5 rounded-lg text-xs shadow-sm transition-all"
                  title="Tải tệp báo cáo .txt về máy"
                >
                  <Icons.Download />
                </button>
              </div>
            </div>

            {/* Thanh tiến độ OJT */}
            <div className="mt-3 bg-blue-800/60 p-2.5 rounded-lg">
              <div className="flex justify-between text-xs mb-1">
                <span>Tiến độ đạt: <strong>{passedCount}/{OJT_CHECKLIST.length}</strong> mục</span>
                <span className={`font-bold ${progressPercent >= 80 ? 'text-emerald-300' : 'text-amber-300'}`}>
                  {progressPercent}% {progressPercent >= 80 ? "(Đạt chuẩn)" : "(Ngưỡng: 80%)"}
                </span>
              </div>
              <div className="w-full bg-blue-950 h-2.5 rounded-full overflow-hidden">
                <div 
                  className={`h-full transition-all duration-300 ${progressPercent >= 80 ? 'bg-emerald-400' : 'bg-amber-400'}`}
                  style={{ width: `${Math.min(progressPercent, 100)}%` }}
                ></div>
              </div>
            </div>

            {/* Thanh Tab */}
            <div className="flex mt-3 bg-blue-700/50 p-1 rounded-lg text-xs font-medium">
              <button 
                onClick={() => setTab("checklist")} 
                className={`flex-1 py-1.5 rounded text-center transition-all ${tab === "checklist" ? "bg-white text-blue-700 shadow font-bold" : "text-white"}`}
              >
                <Icons.CheckSquare /> Checklist
              </button>
              <button 
                onClick={() => setTab("lessons")} 
                className={`flex-1 py-1.5 rounded text-center transition-all ${tab === "lessons" ? "bg-white text-blue-700 shadow font-bold" : "text-white"}`}
              >
                <Icons.BookOpen /> Ôn Bài Học
              </button>
              <button 
                onClick={() => setTab("chat")} 
                className={`flex-1 py-1.5 rounded text-center transition-all ${tab === "chat" ? "bg-white text-blue-700 shadow font-bold" : "text-white"}`}
              >
                <Icons.Bot /> Hỏi Đáp AI
              </button>
            </div>
          </div>

          {/* Tab 1: Checklist */}
          {tab === "checklist" && (
            <div className="flex-1 p-3 space-y-3 pb-8">
              <div className="bg-white rounded-xl p-3 border border-slate-200 shadow-sm space-y-2 text-xs">
                <div className="font-bold text-slate-700 flex justify-between">
                  <span>Thông tin đợt đánh giá</span>
                  <span className="text-blue-600 font-semibold">{evalRound}</span>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="text"
                    placeholder="Họ tên NVBH (*)..."
                    value={staffName}
                    onChange={(e) => setStaffName(e.target.value)}
                    className="border border-slate-200 rounded p-1.5 text-xs focus:outline-none focus:border-blue-500"
                  />
                  <input
                    type="text"
                    placeholder="Tên Showroom..."
                    value={storeName}
                    onChange={(e) => setStoreName(e.target.value)}
                    className="border border-slate-200 rounded p-1.5 text-xs focus:outline-none focus:border-blue-500"
                  />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="text"
                    placeholder="Người đánh giá (Coach/SM)..."
                    value={evaluator}
                    onChange={(e) => setEvaluator(e.target.value)}
                    className="border border-slate-200 rounded p-1.5 text-xs focus:outline-none focus:border-blue-500"
                  />
                  <select
                    value={evalRound}
                    onChange={(e) => setEvalRound(e.target.value)}
                    className="border border-slate-200 rounded p-1.5 text-xs bg-white text-slate-700 focus:outline-none focus:border-blue-500"
                  >
                    <option value="Lần 1">Đánh giá Lần 1</option>
                    <option value="Lần 2">Đánh giá Lần 2</option>
                    <option value="Lần 3">Đánh giá Lần 3 (Chung kết)</option>
                  </select>
                </div>
              </div>

              {/* Nút gửi lớn phía dưới thông tin */}
              <button
                onClick={handleSendToGoogleSheet}
                disabled={isSendingSheet}
                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 shadow transition-all disabled:opacity-50"
              >
                <Icons.SendCloud /> {isSendingSheet ? "Đang gửi dữ liệu về Google Sheet..." : "GỬI KẾT QUẢ ĐÁNH GIÁ VỀ CHO GIẢNG VIÊN"}
              </button>

              <div className="flex gap-1 overflow-x-auto pb-1 no-scrollbar text-xs">
                {["ALL", "A", "B", "C", "D", "E", "G"].map(group => (
                  <button
                    key={group}
                    onClick={() => setFilterGroup(group)}
                    className={`px-3 py-1 rounded-full font-bold whitespace-nowrap transition-all ${filterGroup === group ? "bg-blue-600 text-white shadow" : "bg-white text-slate-600 border border-slate-200"}`}
                  >
                    {group === "ALL" ? "Tất cả (20)" : `Nhóm ${group}`}
                  </button>
                ))}
              </div>

              {filteredChecklist.map((item) => {
                const status = checklistState[item.id];
                return (
                  <div key={item.id} className="bg-white rounded-xl p-3 border border-slate-200 shadow-sm text-sm">
                    <div className="flex justify-between items-start gap-2">
                      <span className="text-xs font-bold px-2 py-0.5 rounded bg-blue-50 text-blue-700">{item.id}</span>
                      <h3 className="font-semibold text-slate-800 flex-1">{item.title}</h3>
                    </div>

                    <p className="text-xs text-slate-500 mt-1">{item.desc}</p>

                    <div className="mt-2 text-xs bg-emerald-50 text-emerald-800 p-2 rounded">
                      <span className="font-bold">✓ Tiêu chí Đạt:</span> {item.passReq}
                    </div>

                    <div className="mt-1 text-xs bg-rose-50 text-rose-800 p-2 rounded">
                      <span className="font-bold">✗ Điểm Chưa đạt:</span> {item.failReq}
                    </div>

                    <input
                      type="text"
                      placeholder="Ghi chú minh chứng (nếu có)..."
                      value={notesState[item.id] || ""}
                      onChange={(e) => handleNoteChange(item.id, e.target.value)}
                      className="w-full mt-2 border border-slate-200 rounded p-1.5 text-xs text-slate-700 focus:outline-none focus:border-blue-400 placeholder-slate-400"
                    />

                    <div className="flex gap-2 mt-3 pt-2 border-t border-slate-100">
                      <button
                        onClick={() => handleCheck(item.id, "pass")}
                        className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all border ${status === "pass" ? "bg-emerald-600 text-white border-emerald-600 shadow" : "bg-white text-emerald-600 border-emerald-300"}`}
                      >
                        Đạt chuẩn
                      </button>
                      <button
                        onClick={() => handleCheck(item.id, "fail")}
                        className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all border ${status === "fail" ? "bg-rose-600 text-white border-rose-600 shadow" : "bg-white text-rose-600 border-rose-300"}`}
                      >
                        Chưa đạt
                      </button>
                    </div>
                  </div>
                );
              })}

              {/* Nút gửi thêm ở cuối trang để người dùng tick xong bấm ngay */}
              <button
                onClick={handleSendToGoogleSheet}
                disabled={isSendingSheet}
                className="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow-md transition-all disabled:opacity-50"
              >
                <Icons.SendCloud /> {isSendingSheet ? "Đang gửi dữ liệu về Google Sheet..." : "HOÀN TẤT & GỬI KẾT QUẢ ĐÁNH GIÁ"}
              </button>
            </div>
          )}

          {/* Tab 2: Ôn tập */}
          {tab === "lessons" && (
            <div className="flex-1 p-3 pb-8">
              <div className="flex gap-1.5 overflow-x-auto pb-2 no-scrollbar">
                {[1, 2, 3, 4, 5].map((day) => (
                  <button
                    key={day}
                    onClick={() => setSelectedDay(day)}
                    className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${selectedDay === day ? "bg-blue-600 text-white shadow" : "bg-white text-slate-600 border border-slate-200"}`}
                  >
                    Ngày {day}
                  </button>
                ))}
              </div>

              <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-sm mt-3">
                <h2 className="font-bold text-blue-700 text-sm mb-3">{LESSONS[selectedDay].title}</h2>
                <div className="space-y-2">
                  {LESSONS[selectedDay].summary.map((point, index) => (
                    <div key={index} className="flex gap-2 text-xs leading-relaxed text-slate-700">
                      <span className="text-blue-500 font-bold">•</span>
                      <span>{point}</span>
                    </div>
                  ))}
                </div>

                <button
                  onClick={() => {
                    setTab("chat");
                    handleSend(`Tóm tắt chi tiết hơn nội dung bài học Ngày ${selectedDay}`);
                  }}
                  className="w-full mt-4 bg-blue-50 hover:bg-blue-100 text-blue-700 py-2 rounded-lg text-xs font-semibold text-center transition-all"
                >
                  Hỏi AI chi tiết về Ngày {selectedDay}
                </button>
              </div>
            </div>
          )}

          {/* Tab 3: Hỏi đáp AI */}
          {tab === "chat" && (
            <div className="flex-1 flex flex-col h-[calc(100vh-170px)]">
              <div className="flex-1 overflow-y-auto p-3 space-y-3 text-xs">
                {messages.map((m, idx) => (
                  <div key={idx} className={`flex ${m.sender === "user" ? "justify-end" : "justify-start"}`}>
                    <div className={`max-w-[85%] rounded-2xl px-3.5 py-2.5 whitespace-pre-line leading-relaxed ${m.sender === "user" ? "bg-blue-600 text-white rounded-tr-none" : "bg-white border border-slate-200 text-slate-800 rounded-tl-none shadow-sm"}`}>
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>

              <div className="p-2 bg-slate-100 border-t border-slate-200 flex gap-2 overflow-x-auto no-scrollbar">
                {[
                  "Tôi build CPU AMD Ryzen 5600 vào Main Asus B650 được không?",
                  "Main AMD mới nhất là dòng nào?",
                  "5 điểm đỏ khi build PC là gì?",
                  "Cách chào khách chuẩn 4 bước?"
                ].map((q, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleSend(q)}
                    className="bg-white border border-slate-300 hover:border-blue-500 text-slate-700 px-2.5 py-1 rounded-full text-[11px] whitespace-nowrap shadow-xs"
                  >
                    {q}
                  </button>
                ))}
              </div>

              <div className="p-2 bg-white border-t border-slate-200 flex gap-2">
                <input
                  type="text"
                  value={inputQuery}
                  onChange={(e) => setInputQuery(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && handleSend()}
                  placeholder="Hỏi về kỹ thuật PC, Laptop, kỹ năng bán hàng..."
                  className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-600"
                />
                <button
                  onClick={() => handleSend()}
                  className="bg-blue-600 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center justify-center hover:bg-blue-700"
                >
                  <Icons.Send />
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
