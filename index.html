    function removeVietnameseTones(str) {
      if (!str) return "";
      return str.normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d").replace(/Đ/g, "D")
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

          evalRound: evalRound,
          evaluator: evaluator.trim() || "Chưa nhập",
          passedCount: passedCount,
          totalCount: OJT_CHECKLIST_62.length,
          progressPercent: progressPercent,
          isPassed: isPassedGoal,
          items: itemsPayload
        };

        try {
          await fetch(GOOGLE_SHEET_WEBAPP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
          alert("✅ ĐÃ GỬI THÀNH CÔNG!\nKết quả đã được ghi nhận vào Google Sheet của Giảng viên.");
        } catch (error) {
          alert("❌ Lỗi mạng khi gửi dữ liệu. Vui lòng kiểm tra lại kết nối!");
        } finally {
          setIsSendingSheet(false);
        }
      };

      const handleExportReport = () => {
        const currentDate = new Date().toLocaleDateString('vi-VN');
        let content = `PHIẾU CHECKLIST ĐÁNH GIÁ NĂNG LỰC – GIAI ĐOẠN 2 (62 TIÊU CHÍ)\n`;
        content += `HỆ THỐNG CỬA HÀNG PHONG VŨ\n`;
        content += `---------------------------------------------------------\n`;
        content += `Họ tên NVBH       : ${staffName || "(Chưa nhập)"} ${staffId ? `[MSNV: ${staffId}]` : ""}\n`;
        content += `Cửa hàng/Showroom : ${storeName || "(Chưa nhập)"}\n`;
        content += `Đợt đánh giá      : ${evalRound}\n`;
        content += `Người đánh giá    : ${evaluator || "(Chưa nhập)"}\n`;
        content += `Ngày xuất         : ${currentDate}\n`;
        content += `---------------------------------------------------------\n`;
        content += `KẾT QUẢ: ${passedCount}/62 mục (${progressPercent}%) - ${isPassedGoal ? "ĐẠT CHUẨN (>=50/62)" : "CHƯA ĐẠT"}\n\n`;

        OJT_CHECKLIST_62.forEach((item, index) => {
          const status = checklistState[item.id] === "pass" ? "[ ĐẠT ]" : checklistState[item.id] === "fail" ? "[ CHƯA ĐẠT ]" : "[ CHƯA ĐÁNH GIÁ ]";
          const note = notesState[item.id] ? ` (${notesState[item.id]})` : "";
          content += `${index + 1}. [${item.id}] ${item.title}: ${status}${note}\n`;
        });

        const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `OJT_DanhGia62_${staffName || "NVBH"}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };

      const findAnswer = (query) => {
        if (!query || !query.trim()) return null;
        const cleanQ = removeVietnameseTones(query);

        let bestMatch = null;
        let maxScore = 0;

        for (const item of kbList) {
          let score = 0;
          for (const kw of (item.keywords || [])) {
            const cleanKW = removeVietnameseTones(kw);
            if (cleanQ.includes(cleanKW)) {
              score += cleanKW.length * 3;
            }
          }
          if (score > maxScore) {
            maxScore = score;
            bestMatch = item;
          }
        }

        if (bestMatch && maxScore >= 5) {
          return `📚 [CHỦ ĐỀ: ${bestMatch.topic}]\n\n${bestMatch.answer}`;
        }

        const matchCriteria = OJT_CHECKLIST_62.find(c => {
          const cleanID = removeVietnameseTones(c.id);
          const cleanTitle = removeVietnameseTones(c.title);
          return cleanQ.includes(cleanID) || cleanQ.includes(cleanTitle);
        });

        if (matchCriteria) {
          return `📌 TIÊU CHÍ OJT [${matchCriteria.id}]:\n• Nội dung: ${matchCriteria.title}\n• Nhóm: ${GROUP_NAMES[matchCriteria.group]}\n• Chuẩn: Thực hiện đúng tiêu chuẩn tại showroom.`;

                </span>
